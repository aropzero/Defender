name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  # Deterministic package/version stamp for the build
  APK_NAME: CitadelOfEchoes

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore (used for both debug and release signing)
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Godot, OU=Godot Engine, O=Stichting Godot, C=NL"

      - name: Install Godot editor + export templates
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head

      - name: Configure Godot editor settings (Android SDK / keystore)
        run: |
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/keystore_release = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/keystore_release_user = "androiddebugkey"
          export/android/keystore_release_pass = "android"
          EOF
          echo "editor settings:"
          cat "${HOME}/.config/godot/editor_settings-4.7.tres"

      - name: Run game self-test (headless)
        run: |
          CITADEL_SELFTEST=1 ./godot --headless --path . 2>&1 | tee selftest.log
          grep -E "SELFTEST OK" selftest.log || (echo "::error::Self-test did not pass"; exit 1)

      - name: Export Android APK (debug)
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" "build/${APK_NAME}.apk"

      - name: Export Android APK (release)
        run: |
          ./godot --headless --path . --export-release "Android" "build/${APK_NAME}-release.apk"

      - name: Verify APK signature
        run: |
          apksigner verify --print-certs "build/${APK_NAME}.apk" | head -3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APK_NAME }}-debug"
          path: "build/${{ env.APK_NAME }}.apk"
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APK_NAME }}-release"
          path: "build/${{ env.APK_NAME }}-release.apk"
          if-no-files-found: error
