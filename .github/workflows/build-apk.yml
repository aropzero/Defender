name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  # Deterministic package/version stamp for the build
  APK_NAME: CitadelOfEchoes
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (cmdline-tools + build-tools)
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -sSLo /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/clt.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          ls "${ANDROID_SDK_ROOT}/build-tools/"

      - name: Create debug keystore (used for both debug and release signing)
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Godot, OU=Godot Engine, O=Stichting Godot, C=NL"

      - name: Cache Godot editor + templates
        uses: actions/cache@v4
        with:
          path: |
            godot.zip
            godot_templates.tpz
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot editor + export templates
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          # Only download when the cache miss; use curl with retries for resilience.
          if [ ! -f godot.zip ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 -o godot.zip \
              "${URL}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          fi
          if [ ! -f godot_templates.tpz ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 -o godot_templates.tpz \
              "${URL}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          fi
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATE_DIR}"
          # Extract to a temp dir, then normalize the package layout: it may be
          # flat (android_debug.apk at root) or wrapped in a 'templates/' folder.
          rm -rf /tmp/gdtpl && mkdir -p /tmp/gdtpl
          unzip -q godot_templates.tpz -d /tmp/gdtpl
          SRC=/tmp/gdtpl
          if [ ! -f "${SRC}/android_debug.apk" ] && [ -d "${SRC}/templates" ]; then
            SRC="${SRC}/templates"
          fi
          cp -a "${SRC}"/. "${TEMPLATE_DIR}"/
          rm -rf /tmp/gdtpl
          ls "${TEMPLATE_DIR}" | head
          test -f "${TEMPLATE_DIR}/android_debug.apk" && echo "android template OK"
          test -f "${TEMPLATE_DIR}/version.txt" && echo "version.txt OK"

      - name: Configure Godot editor settings (Android SDK / keystore)
        run: |
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/keystore_release = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/keystore_release_user = "androiddebugkey"
          export/android/keystore_release_pass = "android"
          EOF
          echo "editor settings:"
          cat "${HOME}/.config/godot/editor_settings-4.7.tres"

      - name: Godot import pass (build global class cache)
        run: |
          ./godot --headless --path . --import
          test -f .godot/global_script_class_cache.cfg && echo "class cache built"

      - name: Run game self-test (headless)
        run: |
          CITADEL_SELFTEST=1 ./godot --headless --path . 2>&1 | tee selftest.log
          grep -E "SELFTEST OK" selftest.log || (echo "::error::Self-test did not pass"; exit 1)

      - name: Export Android APK (debug)
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" "build/${APK_NAME}.apk"

      - name: Export Android APK (release)
        run: |
          ./godot --headless --path . --export-release "Android" "build/${APK_NAME}-release.apk"

      - name: Verify APK signature
        run: |
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --print-certs "build/${APK_NAME}.apk" | head -3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APK_NAME }}-debug"
          path: "build/${{ env.APK_NAME }}.apk"
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APK_NAME }}-release"
          path: "build/${{ env.APK_NAME }}-release.apk"
          if-no-files-found: error
